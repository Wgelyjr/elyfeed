services:
  db:
    image: postgres:16-alpine
    container_name: elyfeed-db
    environment:
      POSTGRES_USER: elyfeed
      POSTGRES_PASSWORD: elyfeed
      POSTGRES_DB: elyfeed
    # No host port: the db is only reachable inside the compose network;
    # the app connects via DATABASE_URL.
    volumes:
      - elyfeed_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elyfeed -d elyfeed"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: elyfeed:latest
    container_name: elyfeed
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://elyfeed:elyfeed@db:5432/elyfeed?sslmode=disable
      HOST: 0.0.0.0
      PORT: "8080"
      REFRESH_INTERVAL: 10m
      # Auth. The defaults make this a local dev deployment: ELYFEED_DEV=true
      # lets the app start without SMTP/OIDC and prints verification emails
      # to the log. Real deployments must set SMTP_* (or OIDC_* + BASE_URL)
      # and ELYFEED_DEV=false. Empty values fall back to the app defaults.
      ELYFEED_DEV: ${ELYFEED_DEV:-true}
      BASE_URL: ${BASE_URL:-}
      SESSION_TTL: ${SESSION_TTL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_IMPLICIT_TLS: ${SMTP_IMPLICIT_TLS:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      FEED_ALLOW_PRIVATE: ${FEED_ALLOW_PRIVATE:-}
    ports:
      # 8080 is the app's internal port. The host port defaults to 8180 because
      # 8080 is often taken on dev machines; override with ELYFEED_PORT.
      - "${ELYFEED_PORT:-8180}:8080"
    restart: unless-stopped

volumes:
  elyfeed_pgdata:
